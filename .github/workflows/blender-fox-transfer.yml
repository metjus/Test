name: Build Blender Fox Transfer

# Builds a standalone Windows .exe and Linux binary (no Python needed to run them).
# - Every push that touches the tool: download the builds from the run's "Artifacts".
# - Pushing a tag like "bst-v1.0.0": also publishes them as a GitHub Release.
on:
  push:
    paths:
      - "blender-fox-transfer/**"
      - ".github/workflows/blender-fox-transfer.yml"
    tags:
      - "bst-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: blender-fox-transfer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - name: Smoke test
        run: python blender_fox_transfer.py --help
      - name: Build .exe
        run: pyinstaller --noconfirm --onefile --windowed --icon assets/icon.ico --name BlenderFoxTransfer blender_fox_transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderFoxTransfer-Windows
          path: blender-fox-transfer/dist/BlenderFoxTransfer.exe

  linux:
    runs-on: ubuntu-latest
    # Build on an older glibc (Debian 11) so the binary runs on Ubuntu 20.04+ and similar.
    container: python:3.12-bullseye
    defaults:
      run:
        working-directory: blender-fox-transfer
    steps:
      - uses: actions/checkout@v4
      - run: pip install --root-user-action=ignore pyinstaller
      - name: Smoke test
        run: python blender_fox_transfer.py --help
      - name: Build binary
        run: |
          pyinstaller --noconfirm --onefile --windowed --name BlenderFoxTransfer blender_fox_transfer.py
          tar -czf dist/BlenderFoxTransfer-Linux.tar.gz -C dist BlenderFoxTransfer
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderFoxTransfer-Linux
          path: blender-fox-transfer/dist/BlenderFoxTransfer-Linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/bst-v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Blender Fox Transfer ${{ github.ref_name }}
          files: |
            dist/BlenderFoxTransfer.exe
            dist/BlenderFoxTransfer-Linux.tar.gz
